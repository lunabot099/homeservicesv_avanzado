<!DOCTYPE html>
<html>
<head>
  <!--
    Si la aplicación se publica en una subcarpeta, el proceso de compilación
    debe sustituir el valor base por esa ruta. La ruta debe comenzar y terminar
    con "/"; un valor incorrecto impide cargar scripts y recursos.

    Referencia:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    Flutter sustituye este marcador con el valor de `--base-href` durante la
    compilación. No reemplazar manualmente `$FLUTTER_BASE_HREF` en este archivo.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HomeServiceSV conecta clientes con trabajadores de servicios para el hogar.">

  <!-- Metadatos e ícono cuando la web se agrega a la pantalla de inicio de iOS. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HomeServiceSV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Ícono mostrado por el navegador. -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HomeServiceSV</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
