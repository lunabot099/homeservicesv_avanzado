name: Publicar Flutter Web en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crear el archivo de entorno para producción
        run: |
          # Normaliza la URL por si el Secret incluye una barra final o /rest/v1.
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_URL="${SUPABASE_URL%/}"
          SUPABASE_URL="${SUPABASE_URL%/rest/v1}"
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "BUCKET_PERFIL_FOTOS=perfil-fotos"
            echo "BUCKET_DUI_DOCUMENTOS=dui-documentos"
            echo "BUCKET_ANTECEDENTES_DOCUMENTOS=antecedentes-documentos"
            echo "BUCKET_SOLICITUDES_IMAGENES=solicitudes-imagenes"
            echo "BUCKET_CHAT_IMAGENES=chat-imagenes"
          } > .env

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar el código
        run: flutter analyze --no-fatal-infos

      - name: Compilar la versión web
        run: flutter build web --release --base-href /homeservicesv_avanzado/

      - name: Permitir que GitHub Pages sirva los recursos de Flutter
        run: touch build/web/.nojekyll

      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build/web
          force_orphan: true
